name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Set app entry point
        run: cp dist/live.html dist/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Set app version
        run: |
          VERSION_NAME=$(node -p "require('./package.json').version")
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Building version $VERSION_NAME (code $VERSION_CODE)"

      - name: Add native plugins (PiP + DND + Reliability)
        run: |
          JAVADIR=$(dirname $(find android/app/src/main/java -name "MainActivity.java"))

          cat > "$JAVADIR/PipPlugin.java" << 'EOF'
          package com.bitto.foclock;

          import android.annotation.SuppressLint;
          import android.app.PictureInPictureParams;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.util.Rational;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          /**
           * Android Picture-in-Picture, auto-triggered on leaving the app.
           *
           * TIMING: enterPictureInPictureMode() only works reliably when called from
           * Activity.onUserLeaveHint(). MainActivity reaches this plugin via the
           * static getInstance() below rather than Bridge.getPluginHandle(), which
           * Capacitor 6 no longer exposes publicly.
           *
           * JS-facing API (window.Capacitor.Plugins.PipPlugin):
           *   isPipSupported()              -> { supported: boolean }
           *   setAutoEnterEnabled({enabled})-> arm/disarm auto-PiP-on-leave
           *   enterPip()                    -> manual/explicit entry (kept for completeness)
           *   addListener('showPipView', fn)-> fires right before entering PiP
           */
          @CapacitorPlugin(name = "PipPlugin")
          public class PipPlugin extends Plugin {

              private static volatile PipPlugin instance;
              private volatile boolean autoEnterEnabled = false;

              @Override
              public void load() {
                  super.load();
                  instance = this;
              }

              public static PipPlugin getInstance() {
                  return instance;
              }

              @PluginMethod
              public void isPipSupported(PluginCall call) {
                  JSObject ret = new JSObject();
                  boolean supported = false;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && getActivity() != null) {
                      PackageManager pm = getActivity().getPackageManager();
                      supported = pm != null && pm.hasSystemFeature(PackageManager.FEATURE_PICTURE_IN_PICTURE);
                  }
                  ret.put("supported", supported);
                  call.resolve(ret);
              }

              @PluginMethod
              public void setAutoEnterEnabled(PluginCall call) {
                  Boolean enabled = call.getBoolean("enabled", false);
                  autoEnterEnabled = enabled != null && enabled;
                  call.resolve();
              }

              @SuppressLint("NewApi")
              @PluginMethod
              public void enterPip(PluginCall call) {
                  notifyListeners("showPipView", new JSObject());
                  boolean ok = doEnterPip();
                  if (ok) call.resolve();
                  else call.reject("Could not enter Picture-in-Picture mode.");
              }

              /** Called directly from MainActivity.onUserLeaveHint() — must stay fast. */
              @SuppressLint("NewApi")
              public void maybeAutoEnterPip() {
                  if (!autoEnterEnabled) return;
                  notifyListeners("showPipView", new JSObject());
                  doEnterPip();
              }

              @SuppressLint("NewApi")
              private boolean doEnterPip() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O || getActivity() == null) return false;
                  try {
                      PictureInPictureParams params = new PictureInPictureParams.Builder()
                              .setAspectRatio(new Rational(3, 4))
                              .build();
                      return getActivity().enterPictureInPictureMode(params);
                  } catch (Exception e) {
                      return false;
                  }
              }
          }
          EOF

          cat > "$JAVADIR/DndPlugin.java" << 'EOF'
          package com.bitto.foclock;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "DndPlugin")
          public class DndPlugin extends Plugin {

              private static final String CHANNEL_SESSION = "session-alerts";
              private static final String CHANNEL_REMINDERS = "study-reminders";

              private NotificationManager nm() {
                  return (NotificationManager) getContext().getSystemService(Context.NOTIFICATION_SERVICE);
              }

              @PluginMethod
              public void isDndSupported(PluginCall call) {
                  JSObject ret = new JSObject();
                  ret.put("supported", Build.VERSION.SDK_INT >= Build.VERSION_CODES.M);
                  call.resolve(ret);
              }

              @PluginMethod
              public void hasDndAccess(PluginCall call) {
                  NotificationManager manager = nm();
                  boolean granted = Build.VERSION.SDK_INT < Build.VERSION_CODES.M
                          || (manager != null && manager.isNotificationPolicyAccessGranted());
                  JSObject ret = new JSObject();
                  ret.put("granted", granted);
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestDndAccess(PluginCall call) {
                  try {
                      Intent intent = new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                  } catch (Exception e) {
                      call.reject("Could not open settings: " + e.getMessage());
                      return;
                  }
                  call.resolve();
              }

              @PluginMethod
              public void enable(PluginCall call) {
                  NotificationManager manager = nm();
                  if (manager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          && manager.isNotificationPolicyAccessGranted()) {
                      manager.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void disable(PluginCall call) {
                  NotificationManager manager = nm();
                  if (manager != null && Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                          && manager.isNotificationPolicyAccessGranted()) {
                      manager.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL);
                  }
                  call.resolve();
              }

              @PluginMethod
              public void ensureBypassChannels(PluginCall call) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationManager manager = nm();
                      if (manager != null) {
                          createChannel(manager, CHANNEL_SESSION, "Session Alerts", "Session start/pause/check-in and completion alerts");
                          createChannel(manager, CHANNEL_REMINDERS, "Study Reminders", "Daily study reminder alerts");
                      }
                  }
                  call.resolve();
              }

              private void createChannel(NotificationManager manager, String id, String name, String description) {
                  if (manager.getNotificationChannel(id) != null) return;
                  NotificationChannel channel = new NotificationChannel(id, name, NotificationManager.IMPORTANCE_HIGH);
                  channel.setDescription(description);
                  channel.enableVibration(true);
                  channel.enableLights(true);
                  channel.setBypassDnd(true);
                  manager.createNotificationChannel(channel);
              }
          }
          EOF

          cat > "$JAVADIR/ReliabilityPlugin.java" << 'EOF'
          package com.bitto.foclock;

          import android.app.AlarmManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ReliabilityPlugin")
          public class ReliabilityPlugin extends Plugin {

              @PluginMethod
              public void checkStatus(PluginCall call) {
                  boolean exactAlarms = true;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      AlarmManager am = (AlarmManager) getContext().getSystemService(Context.ALARM_SERVICE);
                      exactAlarms = am != null && am.canScheduleExactAlarms();
                  }
                  boolean batteryOk = true;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      batteryOk = pm != null && pm.isIgnoringBatteryOptimizations(getContext().getPackageName());
                  }
                  JSObject ret = new JSObject();
                  ret.put("exactAlarmsGranted", exactAlarms);
                  ret.put("batteryOptimizationExempt", batteryOk);
                  call.resolve(ret);
              }

              @PluginMethod
              public void requestExactAlarmPermission(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM);
                          intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                          intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);
                      }
                  } catch (Exception e) {
                      call.reject("Could not open Alarms & reminders settings: " + e.getMessage());
                      return;
                  }
                  call.resolve();
              }

              @PluginMethod
              public void requestBatteryExemption(PluginCall call) {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + getContext().getPackageName()));
                          intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);
                      }
                  } catch (Exception e) {
                      call.reject("Could not open battery settings: " + e.getMessage());
                      return;
                  }
                  call.resolve();
              }
          }
          EOF

          cat > "$JAVADIR/MainActivity.java" << 'EOF'
          package com.bitto.foclock;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          /**
           * If you already have a MainActivity.java in your project, don't replace it —
           * just add the registerPlugin(...) lines and the onUserLeaveHint() override
           * to your existing file, and keep the rest as-is.
           */
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(PipPlugin.class);
                  registerPlugin(DndPlugin.class);
                  registerPlugin(ReliabilityPlugin.class);
                  super.onCreate(savedInstanceState);
              }

              // Fired right as the user presses home / switches apps — the correct,
              // reliable moment to call enterPictureInPictureMode(). Reaches the
              // plugin via its own static instance rather than Bridge.getPluginHandle(),
              // which Capacitor 6 no longer exposes publicly.
              @Override
              public void onUserLeaveHint() {
                  super.onUserLeaveHint();
                  PipPlugin plugin = PipPlugin.getInstance();
                  if (plugin != null) {
                      plugin.maybeAutoEnterPip();
                  }
              }
          }
          EOF

      - name: Add battery-exemption permission to manifest
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Enable PiP in AndroidManifest
        run: |
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:supportsPictureInPicture="true"/' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          convert assets/icon.png -resize 96x96 -colorspace Gray -threshold 50% -negate -alpha extract -channel A -fuzz 10% -transparent black android/app/src/main/res/drawable/ic_stat_icon.png

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/foclock-release.keystore

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/app/foclock-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: foclock-apk
          path: android/app/build/outputs/apk/release/app-release.apk
