name: Generate Signing Key (run once)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (write this down!)'
        required: true
      key_password:
        description: 'Key password (can be same as above, write this down!)'
        required: true
      key_alias:
        description: 'Key alias (a short name, e.g. foclock)'
        required: true
        default: 'foclock'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore foclock-release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Basit Iqbal Bitto, OU=FocLock, O=FocLock, L=Jessore, S=Khulna, C=BD"

      - name: Encode as base64 (so it's safe to paste as a text secret)
        run: base64 -w 0 foclock-release.keystore > foclock-release.keystore.base64.txt

      - name: Upload keystore + base64 text
        uses: actions/upload-artifact@v4
        with:
          name: foclock-signing-key
          path: |
            foclock-release.keystore
            foclock-release.keystore.base64.txt
          retention-days: 1
